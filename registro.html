<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==========================
    NAVBAR NEGRA
    ========================== -->
    <nav class="navbar">
        <div class="logo">
            <img src="img/check.png" alt="CHECK">
        </div>
        <div class="nav-right">
            <a href="login.html" class="nav-link">Iniciar Sesión</a>
        </div>
    </nav>

    <!-- ==========================
    FORMULARIO DE REGISTRO
    ========================== -->
    <div class="register-wrapper">
        <div class="container-card">
            <h2>Crear Cuenta</h2>
            <p class="sub">Únete a la comunidad CHECK</p>

            <div id="message-box" class="message-box"></div>

            <form id="registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre de usuario</label>
                    <input type="text" id="nombre" placeholder="Elige un usuario" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <div class="register-links">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
    </div>

    <!-- ==========================
    FOOTER
    ========================== -->
    <footer>
        <p>&copy; 2026 CHECK · Nicaragua</p>
    </footer>

    <!-- ==========================
    SCRIPTS
    ========================== -->
    <script src="js/registro.js"></script>

</body>
</html>
