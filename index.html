<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==========================
    NAVBAR NEGRA
    ========================== -->
    <nav class="navbar">
        <div class="logo">
            <img src="img/check.png" alt="CHECK">
        </div>
        <div class="nav-right">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar...">
            </div>
            <i class="fas fa-bell"></i>
            <i class="fas fa-bars menu-hamburger"></i>
            <div class="user-menu">
                <div class="avatar">JS</div>
                <span id="nombre-usuario">Invitado</span>
            </div>
            <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
        </div>
    </nav>

    <!-- ==========================
    HERO (dos columnas)
    ========================== -->
    <section class="hero" style="display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px;">
        <!-- Columna izquierda: información -->
        <div class="container-card">
            <div>
                <h2>CHECK</h2>
                <p class="sub">Tu esfuerzo físico cuenta</p>
                <div class="text-line" style="height:10px; width:85%; background:rgba(255,255,255,0.2); border-radius:12px; margin:8px 0;"></div>
                <div class="text-line short" style="height:10px; width:55%; background:rgba(255,255,255,0.2); border-radius:12px; margin:8px 0;"></div>
            </div>
            <div style="display:flex; gap:20px; margin-top:16px; font-size:1.4rem;">
                <i class="fas fa-heart" style="cursor:pointer; background:rgba(255,255,255,0.15); padding:8px; border-radius:50%; transition:0.3s;"></i>
                <i class="fas fa-star" style="cursor:pointer; background:rgba(255,255,255,0.15); padding:8px; border-radius:50%; transition:0.3s;"></i>
            </div>
        </div>

        <!-- Columna derecha: imagen / mensaje -->
        <div class="container-card" style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:200px;">
            <i class="fas fa-check-circle" style="font-size:2.8rem; opacity:0.7;"></i>
            <span style="font-style:italic; font-weight:400;">Prevención · Comunidad</span>
        </div>
    </section>

    <hr style="border:none; border-top:2px solid var(--check-gray-border); margin:20px 0 18px;">

    <!-- ==========================
    FILTROS
    ========================== -->
    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;">
        <span class="tag active">Todos</span>
        <span class="tag">Eventos</span>
        <span class="tag">Misiones</span>
        <span class="tag">Comunidad</span>
    </div>

    <!-- ==========================
    ACTIVIDAD
    ========================== -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <div style="display:flex; align-items:center; gap:8px;">
            <h2 style="font-size:1.4rem; font-weight:700; color:var(--check-black); font-family:var(--font-title);">Actividad</h2>
            <i class="fas fa-chevron-right" style="color:var(--check-blue); font-size:1rem;"></i>
        </div>
        <div style="display:flex; gap:12px; color:#888; font-size:0.85rem;">
            <i class="fas fa-ellipsis-h" style="cursor:pointer;"></i>
            <span>4</span>
        </div>
    </div>

    <!-- ==========================
    TARJETAS (3 columnas)
    ========================== -->
    <section style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px;">
        <!-- Tarjeta 1: Evento -->
        <div class="container-card" style="padding:0; overflow:hidden;">
            <div style="height:130px; background:var(--check-white); display:flex; align-items:center; justify-content:center; font-size:2.6rem; color:var(--check-blue); border-bottom:1px solid var(--check-gray-border);">
                <i class="fas fa-running"></i>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-top:1px solid var(--check-gray-border);">
                <div style="display:flex; align-items:center; gap:8px;">
                    <i class="fas fa-calendar-alt" style="color:var(--check-white); opacity:0.7; font-size:0.9rem;"></i>
                    <span style="font-size:0.8rem; font-weight:700; color:var(--check-white); font-family:var(--font-title);">Evento</span>
                </div>
                <div style="background:var(--check-white); color:var(--check-blue); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:800; transition:0.3s;">✓</div>
            </div>
        </div>

        <!-- Tarjeta 2: Misión -->
        <div class="container-card" style="padding:0; overflow:hidden;">
            <div style="height:130px; background:var(--check-white); display:flex; align-items:center; justify-content:center; font-size:2.6rem; color:var(--check-blue); border-bottom:1px solid var(--check-gray-border);">
                <i class="fas fa-trophy"></i>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-top:1px solid var(--check-gray-border);">
                <div style="display:flex; align-items:center; gap:8px;">
                    <i class="fas fa-calendar-alt" style="color:var(--check-white); opacity:0.7; font-size:0.9rem;"></i>
                    <span style="font-size:0.8rem; font-weight:700; color:var(--check-white); font-family:var(--font-title);">Misión</span>
                </div>
                <div style="background:var(--check-white); color:var(--check-blue); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:800; transition:0.3s;">✓</div>
            </div>
        </div>

        <!-- Tarjeta 3: Comunidad -->
        <div class="container-card" style="padding:0; overflow:hidden;">
            <div style="height:130px; background:var(--check-white); display:flex; align-items:center; justify-content:center; font-size:2.6rem; color:var(--check-blue); border-bottom:1px solid var(--check-gray-border);">
                <i class="fas fa-users"></i>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-top:1px solid var(--check-gray-border);">
                <div style="display:flex; align-items:center; gap:8px;">
                    <i class="fas fa-calendar-alt" style="color:var(--check-white); opacity:0.7; font-size:0.9rem;"></i>
                    <span style="font-size:0.8rem; font-weight:700; color:var(--check-white); font-family:var(--font-title);">Comunidad</span>
                </div>
                <div style="background:var(--check-white); color:var(--check-blue); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:800; transition:0.3s;">✓</div>
            </div>
        </div>
    </section>

    <!-- ==========================
    FOOTER
    ========================== -->
    <footer>
        <p>&copy; 2026 CHECK · Nicaragua</p>
    </footer>

    <!-- ==========================
    SCRIPTS
    ========================== -->
    <script src="js/index.js"></script>

</body>
</html>
