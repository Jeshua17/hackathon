<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECK - Login / Registro</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-modal">
    <button class="close-btn" id="close-modal-btn" aria-label="Cerrar">&times;</button>

    <!-- COLUMNA IZQUIERDA -->
    <div class="auth-banner">
      <div class="banner-overlay"></div>
      
      <div class="banner-content">
        <div class="logo">
          <span class="logo-text">CHECK</span>
        </div>

        <h1 class="hero-title">
          <span>EL DEPORTE</span>
          <span class="highlight">ES TU CAMINO.</span>
        </h1>

        <p class="hero-description">
          Únete a más de 400 jóvenes que eligieron el movimiento, la comunidad y la vida al aire libre.
        </p>

        <!-- RECUADROS DEL BANNER -->
        <div class="badge-tags">
          <span class="badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            SIN DROGAS
          </span>

          <span class="badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M5.6 5.6C9.2 9.2 9.2 14.8 5.6 18.4"></path>
              <path d="M18.4 5.6C14.8 9.2 14.8 14.8 18.4 18.4"></path>
              <line x1="12" y1="2" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
            </svg>
            DEPORTE REAL
          </span>

          <span class="badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            COMUNIDAD SANA
          </span>
        </div>
      </div>
    </div>

    <!-- COLUMNA DERECHA -->
    <div class="auth-form-container">
      <div class="auth-tabs">
        <button class="tab-btn active" id="tab-login">INICIAR SESIÓN</button>
        <button class="tab-btn" id="tab-register">CREAR CUENTA</button>
      </div>

      <!--  INICIAR SESIÓN -->
      <form class="auth-form active" id="form-login">
        <div class="form-group">
          <label>CORREO ELECTRÓNICO</label>
          <input type="email" id="input-correo" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label>CONTRASEÑA</label>
          <div class="input-password-wrapper">
            <input type="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
              <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-submit">ENTRAR &rarr;</button>

        <p class="switch-form-text">
          ¿No tienes cuenta? <a href="#" id="link-to-register">Regístrate gratis</a>
        </p>
      </form>

      <!-- CREAR CUENTA -->
      <form class="auth-form" id="form-register">
        <div class="form-row">
          <div class="form-group">
            <label>NOMBRE</label>
            <input type="text" placeholder="Carlos" required>
          </div>
          <div class="form-group">
            <label>APELLIDO</label>
            <input type="text" placeholder="Rodríguez" required>
          </div>
        </div>

        <div class="form-group">
          <label>CORREO ELECTRÓNICO</label>
          <input type="email" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label>CIUDAD</label>
          <select required>
            <option value="" disabled selected>Selecciona tu localidad</option>
            <option value="sutiava">Sutiava</option>
            <option value="guadalupe">Guadalupe</option>
            <option value="laborio">Laborio</option>
            <option value="primera_mayo">Primera de Mayo</option>
          </select>
        </div>

        <div class="form-group">
          <label>CONTRASEÑA</label>
          <div class="input-password-wrapper">
            <input type="password" placeholder="Mínimo 8 caracteres" required minlength="8">
            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
              <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- ACTIVIDADES FAVORITAS -->
        <div class="form-group">
          <div class="label-with-limit">
            <label>ACTIVIDAD FAVORITA</label>
            <span class="limit-hint">Máx. 3</span>
          </div>
          <div class="interest-chips">
            
            <label class="chip">
              <input type="checkbox" name="activity" value="futbol">
              <span class="chip-content">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="m12 7-3.5 2.5 1.3 4h4.4l1.3-4z"></path>
                  <path d="M12 7V2M8.5 9.5 4 7M9.8 13.5 6.5 17M14.2 13.5l3.3 3.5M15.5 9.5 20 7"></path>
                </svg>
                FÚTBOL
              </span>
            </label>

            <label class="chip">
              <input type="checkbox" name="activity" value="baloncesto">
              <span class="chip-content">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M5.6 5.6C9.2 9.2 9.2 14.8 5.6 18.4"></path>
                  <path d="M18.4 5.6C14.8 9.2 14.8 14.8 18.4 18.4"></path>
                  <line x1="12" y1="2" x2="12" y2="22"></line>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                </svg>
                BALONCESTO
              </span>
            </label>

            <label class="chip">
              <input type="checkbox" name="activity" value="skate">
              <span class="chip-content">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="9" width="20" height="6" rx="3"></rect>
                  <circle cx="6" cy="18" r="1.5"></circle>
                  <circle cx="18" cy="18" r="1.5"></circle>
                </svg>
                SKATE
              </span>
            </label>

            <label class="chip">
              <input type="checkbox" name="activity" value="senderismo">
              <span class="chip-content">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m8 3 4 8 5-3 5 13H2L8 3z"></path>
                </svg>
                SENDERISMO
              </span>
            </label>

            <label class="chip">
              <input type="checkbox" name="activity" value="ciclismo">
              <span class="chip-content">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="5.5" cy="17.5" r="3.5"></circle>
                  <circle cx="18.5" cy="17.5" r="3.5"></circle>
                  <polyline points="15 6 12 10 9 6"></polyline>
                  <polyline points="12 10 12 17.5"></polyline>
                  <polyline points="5.5 17.5 8.5 11 15 11 18.5 17.5"></polyline>
                </svg>
                CICLISMO
              </span>
            </label>

            <label class="chip">
              <input type="checkbox" name="activity" value="social">
              <span class="chip-content">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                SOCIAL
              </span>
            </label>

            <label class="chip">
              <input type="checkbox" name="activity" value="otros">
              <span class="chip-content">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="1"></circle>
                  <circle cx="19" cy="12" r="1"></circle>
                  <circle cx="5" cy="12" r="1"></circle>
                </svg>
                OTROS
              </span>
            </label>

          </div>
        </div>

        <button type="submit" class="btn btn-submit">CREAR MI CUENTA &rarr;</button>

        <p class="terms-text">
          Al registrarte aceptas nuestros <a href="terminos_login.html">Términos de uso</a> y la <a href="privacidad_login.html">Política de privacidad</a>.
        </p>
      </form>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
